services:
  swaggen-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SWAGGEN_BIND: "0.0.0.0:8080"
      SWAGGEN_MONGO_URI: "${SWAGGEN_MONGO_URI:?SWAGGEN_MONGO_URI is required and must point to a MongoDB replica set}"
      SWAGGEN_MONGO_DB: "${SWAGGEN_MONGO_DB:-swaggen}"
      SWAGGEN_BOOTSTRAP_TOKEN: "${SWAGGEN_BOOTSTRAP_TOKEN:-}"
      SWAGGEN_FIREBASE_PROJECT_ID: "${SWAGGEN_FIREBASE_PROJECT_ID:-}"
      SWAGGEN_FIREBASE_WEB_API_KEY: "${SWAGGEN_FIREBASE_WEB_API_KEY:-}"
      SWAGGEN_FIREBASE_AUTH_DOMAIN: "${SWAGGEN_FIREBASE_AUTH_DOMAIN:-}"
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${SWAGGEN_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
