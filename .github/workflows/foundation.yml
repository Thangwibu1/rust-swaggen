name: Foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo build -p swaggen-desktop -p swaggen-server --locked --target x86_64-pc-windows-msvc
      - run: cargo run -p swaggen-local-store --bin store-crash-probe --locked --target x86_64-pc-windows-msvc
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.100.0 test -p swaggen-server -p swaggen-api-contract -p swaggen-domain --locked
      - run: cargo +1.100.0 clippy -p swaggen-server -p swaggen-api-contract -p swaggen-domain --all-targets --locked -- -D warnings
      - run: cargo +1.100.0 build -p swaggen-server --locked
