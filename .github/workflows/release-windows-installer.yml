name: Release Windows Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0-early-access)'
        required: true
        default: '1.0.0-early-access'

permissions:
  contents: write

jobs:
  build-windows-installers:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Determine version & MSI numeric ProductVersion
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $raw = "${{ inputs.version }}".Trim()
          } else {
            $raw = "${{ github.ref_name }}".Trim()
          }
          $v = $raw -replace '^[vV]', ''
          $core = ($v -split '[-+]')[0]
          $parts = $core.Split('.')
          $maj = if ($parts.Length -gt 0 -and $parts[0] -match '^\d+$') { $parts[0] } else { "1" }
          $min = if ($parts.Length -gt 1 -and $parts[1] -match '^\d+$') { $parts[1] } else { "0" }
          $pat = if ($parts.Length -gt 2 -and $parts[2] -match '^\d+$') { $parts[2] } else { "0" }
          $msiVer = "$maj.$min.$pat.0"
          $isPre = if ($v.Contains("-")) { "true" } else { "false" }

          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_version=$msiVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$isPre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stamp release version into workspace on runner
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $ct = Get-Content Cargo.toml -Raw
          $curVer = [regex]::Match($ct, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($curVer -and $curVer -ne $v) {
            $ct = [regex]::Replace($ct, '(?m)^version\s*=\s*"[^"]+"', "version = `"$v`"", 1)
            Set-Content -Path Cargo.toml -Value $ct -NoNewline -Encoding UTF8
            $cl = Get-Content Cargo.lock -Raw
            $cl = [regex]::Replace(
              $cl,
              "(name\s*=\s*`"swaggen-[^`"]+`"\r?\nversion\s*=\s*`")$([regex]::Escape($curVer))(`")",
              "`${1}$v`${2}"
            )
            Set-Content -Path Cargo.lock -Value $cl -NoNewline -Encoding UTF8
            Write-Host "Stamped runner Cargo.toml & Cargo.lock version: $curVer -> $v"
          }

      - name: Build release binaries & portable bundle
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\bundle-result.ps1 -Version "${{ steps.ver.outputs.version }}" -Online

      - name: Install WiX Toolset v4 & UI Extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add -g WixToolset.UI.wixext/4.0.5

      - name: Build WiX (.msi) + Inno Setup (.exe) + Portable (.zip) + latest.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $msiVer = "${{ steps.ver.outputs.msi_version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $bundle = (Resolve-Path "result\v$v").Path
          $out = (New-Item -ItemType Directory -Force -Path "release-assets").FullName

          # 1. WiX v4 Full Interactive Wizard MSI (WixUI_InstallDir with Swaggen logo + Choose Folder)
          wix build -arch x64 -ext WixToolset.UI.wixext -d "AppVersion=$msiVer" -d "DisplayVersion=$v" -d "BundleDir=$bundle" -o "$out\Swaggen-$v-x64.msi" "installer\swaggen.wxs"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }

          # 2. Inno Setup 6 Full Wizard EXE (Swaggen logo, Welcome, License, Choose Folder, Shortcuts, Launch)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DBundleDir=$bundle" "/O$out" "installer\swaggen.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          # 3. Portable ZIP (can also be applied in-place from Swaggen Settings -> Software Updates)
          Compress-Archive -Path "$bundle\bin", "$bundle\config", "$bundle\docs", "$bundle\Swaggen.cmd", "$bundle\Swaggen-Portable.cmd", "$bundle\README.txt", "$bundle\version.json" -DestinationPath "$out\Swaggen-Portable-$v-win64.zip" -Force

          # 4. Compute SHA-256 hashes & generate latest.json for in-app auto-updater
          $msiPath = "$out\Swaggen-$v-x64.msi"
          $exePath = "$out\Swaggen-Setup-$v-x64.exe"
          $zipPath = "$out\Swaggen-Portable-$v-win64.zip"

          $msiSha = (Get-FileHash $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeSha = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSha = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()

          $baseUrl = "https://github.com/$repo/releases/download/$tag"
          $latestObj = [ordered]@{
            version          = $v
            tag              = $tag
            published_at     = (Get-Date).ToUniversalTime().ToString("o")
            msi_url          = "$baseUrl/Swaggen-$v-x64.msi"
            msi_sha256       = $msiSha
            installer_url    = "$baseUrl/Swaggen-Setup-$v-x64.exe"
            installer_sha256 = $exeSha
            portable_url     = "$baseUrl/Swaggen-Portable-$v-win64.zip"
            portable_sha256  = $zipSha
            notes            = "Swaggen $tag Windows Installer release (WiX MSI, Inno Setup EXE, Portable ZIP)."
          }
          $latestObj | ConvertTo-Json -Depth 4 | Set-Content -Path "$out\latest.json" -Encoding UTF8

          # 5. SHA256SUMS.txt
          Get-ChildItem -Path $out -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Path "$out\SHA256SUMS.txt" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Swaggen ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          files: release-assets/*
          generate_release_notes: true

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swaggen-windows-installers-${{ steps.ver.outputs.version }}
          path: release-assets/*
