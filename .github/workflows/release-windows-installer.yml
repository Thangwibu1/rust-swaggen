name: Release Windows Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.3)'
        required: true
        default: '0.1.3'

permissions:
  contents: write

jobs:
  build-windows-installers:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build release binaries & portable bundle
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\bundle-result.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5

      - name: Build Inno Setup (.exe) + WiX (.msi) + Portable (.zip)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $bundle = (Resolve-Path "result\v$v").Path
          $out = (New-Item -ItemType Directory -Force -Path "release-assets").FullName

          # 1. Inno Setup Wizard EXE (preinstalled on windows-latest)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DBundleDir=$bundle" "/O$out" "installer\swaggen.iss"

          # 2. WiX v4 MSI Installer
          wix build -arch x64 -d "AppVersion=$v.0" -d "BundleDir=$bundle" -o "$out\Swaggen-$v-x64.msi" "installer\swaggen.wxs"

          # 3. Portable ZIP
          Compress-Archive -Path "$bundle\*" -DestinationPath "$out\Swaggen-Portable-$v-win64.zip" -Force

          # 4. SHA-256 Checksums
          Get-ChildItem -Path $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content -Path "$out\SHA256SUMS.txt" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*
          generate_release_notes: true

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swaggen-windows-installers-${{ steps.ver.outputs.version }}
          path: release-assets/*
