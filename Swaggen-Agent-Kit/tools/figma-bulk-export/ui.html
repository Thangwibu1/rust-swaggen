<!doctype html><meta charset="utf-8"><style>body{font:13px system-ui;padding:18px;background:white;color:#203735}button{padding:9px;margin:4px;border:1px solid #607572;background:white;cursor:pointer}#downloads a{display:block;margin:7px 0}pre{white-space:pre-wrap}</style>
<h2>Swaggen bulk export</h2><p>Xuất PNG 1× toàn bộ màn hình, SVG component và JSON chi tiết. Chỉ đọc file; không sửa thiết kế, không gửi dữ liệu ra mạng. Mỗi trang tạo một ZIP để giới hạn bộ nhớ.</p>
<button id="start">Xuất toàn bộ các trang</button><button id="cancel">Dừng sau mục hiện tại</button><pre id="status">Chưa chạy.</pre><div id="downloads"></div><script>// ZIP STORE encoder: UTF-8 names, CRC32, no dependencies; no ZIP64 (limit checked).
(function(root){
const table=new Uint32Array(256);
for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0;}
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
function zipStore(files){
 if(files.length>65535)throw Error('ZIP entry limit');
 const enc=new TextEncoder();const parts=[];const directory=[];let offset=0;
 for(const file of files){
  if(file.path.startsWith('/')||file.path.split('/').includes('..'))throw Error('Unsafe path');
  const name=enc.encode(file.path),data=file.bytes instanceof Uint8Array?file.bytes:new Uint8Array(file.bytes);
  if(data.length>0xffffffff||offset>0xffffffff||name.length>65535)throw Error('ZIP size limit');
  const crc=crc32(data),local=new Uint8Array(30+name.length),lv=new DataView(local.buffer);
  lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x800,true);
  lv.setUint16(12,33,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);local.set(name,30);
  parts.push(local,data);
  const central=new Uint8Array(46+name.length),cv=new DataView(central.buffer);
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);
  cv.setUint16(14,33,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);central.set(name,46);
  directory.push(central);offset+=local.length+data.length;
 }
 const directorySize=directory.reduce((a,b)=>a+b.length,0);const end=new Uint8Array(22),ev=new DataView(end.buffer);
 ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,directorySize,true);ev.setUint32(16,offset,true);
 return [...parts,...directory,end];
}
root.SwaggenZip={crc32,zipStore};
})(typeof module==='object'?module.exports:window);
</script><script>
let files=[],bytesTotal=0,archives=0,failed=false,active=false;
const status=document.getElementById('status');
function archive(name){if(!files.length)return;const blob=new Blob(SwaggenZip.zipStore(files),{type:'application/zip'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.zip';a.textContent='Tải '+name+'.zip';document.getElementById('downloads').appendChild(a);files=[];bytesTotal=0;archives++;}
document.getElementById('start').onclick=()=>{if(active)return;active=true;failed=false;files=[];bytesTotal=0;status.textContent='Đang xuất…';parent.postMessage({pluginMessage:{type:'start'}},'*');};
document.getElementById('cancel').onclick=()=>parent.postMessage({pluginMessage:{type:'cancel'}},'*');
window.onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;
 try{
 if(m.type==='file'||m.type==='text'){const bytes=m.type==='text'?new TextEncoder().encode(m.text):new Uint8Array(m.bytes);bytesTotal+=bytes.length;if(bytesTotal>256*1024*1024){failed=true;throw Error('Trang vượt 256MiB. Đã dừng, dữ liệu là bản xuất chưa đầy đủ.');}files.push({path:m.path,bytes});}
 if(m.type==='page-start')status.textContent='Trang: '+m.page+' / '+m.total+' mục';
 if(m.type==='progress')status.textContent='Đã xử lý '+m.completed+': '+m.name;
 if(m.type==='page-complete')archive('Swaggen-'+m.page);
 if(m.type==='finished'){archive('Swaggen-export-report');active=false;status.textContent=(failed||m.cancelled||m.errors.length?'CHƯA ĐẦY ĐỦ':'HOÀN TẤT')+' — '+m.completed+' mục; '+m.errors.length+' lỗi; '+archives+' ZIP. Tải từng ZIP bên dưới, giải nén vào cùng thư mục kit và chạy validator/đối chiếu manifest.';}
 if(m.type==='fatal'){active=false;failed=true;archive('Swaggen-partial');status.textContent='LỖI: '+m.error;}
 }catch(error){failed=true;parent.postMessage({pluginMessage:{type:'cancel'}},'*');status.textContent=String(error);}
};
</script>
